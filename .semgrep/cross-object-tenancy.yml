rules:
  - id: cross-object-insert-requires-tenancy-guard
    languages: [go]
    severity: ERROR
    message: >-
      This store inserts a cross-object *_id reference alongside workspace_id without
      a workspace guard. Route the reference through tenancy.AssertRefInWorkspace
      (internal/tenancy) so a caller cannot link an object to a reference in another
      workspace. This is the regression lock for the object-graph cross-object
      tenancy class — see internal/tenancy/closure_test.go.
    patterns:
      # A pgx INSERT ... VALUES whose column list carries workspace_id AND a foreign
      # <x>_id reference (in either order) — i.e. a CALLER-SUPPLIED cross-object ref.
      # INSERT ... SELECT that derives the ref from an in-workspace query (e.g. the
      # ai_spend_events ledger: SELECT id FROM issues WHERE workspace_id=$n) is safe by
      # construction — the ref provably shares the workspace — and is out of scope.
      # TWO SPELLINGS OF THE SAME TEST, because ONE OF THEM CANNOT SEE HALF THIS REPO.
      # (i) metavariable-regex reads the SOURCE TEXT of the argument expression. It sees an
      #     inline literal, and a concatenation whose matched span stays inside one operand.
      #     It is BLIND to SQL held in an identifier — `const insertSQL = ...; Exec(ctx,
      #     insertSQL, ...)` binds $SQL to the NAME, and the name is not INSERT INTO anything.
      # (ii) the "=~/.../" string-literal form matches the string VALUE after semgrep's
      #     constant propagation, so it reads through a const/var binding.
      # Neither subsumes the other: (ii) cannot fold a concat with a RUNTIME operand, which is
      # exactly what internal/issue/store.go's upsert is. The union is the coverage.
      # Measured before this union existed: 16 of the 18 statements this rule is written for
      # were visible, and the 2 blind ones were the `issues` INSERT and UPSERT — the repo's
      # central write path, guarded correctly but with no lock over the guard.
      #
      # ⚠ source_id|target_id ARE IN THE ALTERNATION BECAUSE THEY WERE THE NEXT INSTANCE OF
      # THAT SAME SHAPE. internal/dependency writes `issue_relations (source_id, target_id,
      # type, workspace_id, created_by)` — workspace_id beside TWO caller-supplied issue
      # references, exactly what this rule exists for — and the column names were not listed,
      # so it matched nothing here. MEASURED at 11e88bf: deleting
      # dependency.Store.Create's assertIssuesShareWorkspace call left the WHOLE .semgrep/
      # lock at 0 findings. Widening the alternation adds exactly those 2 statements and no
      # others across internal/ cmd/; both are then excluded by the guard clause below.
      # ⚠ STILL NOT COVERED, stated rather than implied: BulkCreateRelations' bulk write is
      # `INSERT … SELECT … FROM UNNEST(...)`, and both regexes here are anchored on `) VALUES`,
      # so this rule cannot see it whatever the alternation says. That statement is covered by
      # child-insert-tenancy.yml instead, via the assertIssueInWorkspace guard.
      # scripts/w34-tenancy-lock-visibility-controls.py is the positive control, both directions.
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $Q.QueryRow($CTX, $SQL, ...)
                  - pattern: $Q.Exec($CTX, $SQL, ...)
              - metavariable-regex:
                  metavariable: $SQL
                  regex: >-
                    (?s).*INSERT\s+INTO\s+\w+\s*\([^)]*\bworkspace_id\b[^)]*\b(team_id|project_id|board_id|member_id|issue_id|cycle_id|parent_id|assignee_id|milestone_id|source_id|target_id)\b[^)]*\)\s*VALUES|.*INSERT\s+INTO\s+\w+\s*\([^)]*\b(team_id|project_id|board_id|member_id|issue_id|cycle_id|parent_id|assignee_id|milestone_id|source_id|target_id)\b[^)]*\bworkspace_id\b[^)]*\)\s*VALUES
          - pattern-either:
              - pattern: $Q.QueryRow($CTX, "=~/(?s).*INSERT\s+INTO\s+\w+\s*\([^)]*\bworkspace_id\b[^)]*\b(team_id|project_id|board_id|member_id|issue_id|cycle_id|parent_id|assignee_id|milestone_id|source_id|target_id)\b[^)]*\)\s*VALUES|.*INSERT\s+INTO\s+\w+\s*\([^)]*\b(team_id|project_id|board_id|member_id|issue_id|cycle_id|parent_id|assignee_id|milestone_id|source_id|target_id)\b[^)]*\bworkspace_id\b[^)]*\)\s*VALUES/", ...)
              - pattern: $Q.Exec($CTX, "=~/(?s).*INSERT\s+INTO\s+\w+\s*\([^)]*\bworkspace_id\b[^)]*\b(team_id|project_id|board_id|member_id|issue_id|cycle_id|parent_id|assignee_id|milestone_id|source_id|target_id)\b[^)]*\)\s*VALUES|.*INSERT\s+INTO\s+\w+\s*\([^)]*\b(team_id|project_id|board_id|member_id|issue_id|cycle_id|parent_id|assignee_id|milestone_id|source_id|target_id)\b[^)]*\bworkspace_id\b[^)]*\)\s*VALUES/", ...)
      # Excluded when the enclosing function routes the reference through a workspace guard AND
      # ACTS ON THE ANSWER: the shared primitive, or a grandfathered per-store guard.
      #
      # ⚠⚠ EVERY ARM BELOW REQUIRES THE `return`, AND THAT IS THE WHOLE POINT OF THE SHAPE. These
      # arms used to release a function that merely CONTAINED a guard call — semgrep's `...`
      # matches any body, so a guard whose refusal never fires satisfied the exemption and this
      # rule stayed green. It is the identical defect #173 removed from owner-gate.yml ("a gate
      # that wrote 403 and then fell through satisfied the pattern-not"), one rule over, and #174
      # recorded the same limit for rule C and it was never re-measured here.
      #
      # MEASURED at `a0e9185`, per site: leave the call, disable its refusal
      # (`if err := <guard>; err != nil && false {`), and ask semgrep. TWELVE SITES, semgrep
      # CAUGHT **0 of 12** — every arm kept its exemption with the guard inert. With the arms
      # below it is **10 of 12**, and the other two are two DIFFERENT things, both measured every
      # run by scripts/w34-refguard-semgrep-census-m3r8.py rather than left as a shortfall:
      #
      #   · template/store.go:388 is in ApplyTemplate, which LOOKS UP and never INSERTs. This rule
      #     is cross-object-INSERT-requires-tenancy-guard, so a function with no INSERT is outside
      #     its population by construction. The census proves that is the reason rather than a
      #     blind package: template's OTHER guard — Create/team_id, which DOES sit beside an
      #     INSERT — is CAUGHT.
      #   · notification/store.go guards TWO refs in ONE function (members :64, issues :68), and
      #     `pattern-not-inside` is per-FUNCTION, not per-REFERENCE. Either intact guard releases
      #     the whole function, so ONE inert guard hides behind its sibling. Shown both ways:
      #     either alone NOT CAUGHT, both together CAUGHT. ⚠ THAT SITE IS STILL HELD — both of its
      #     guards are caught by `go test ./internal/notification/`, measured in each direction.
      #     Semgrep is blind there; the repository is not. Closing it inside semgrep would mean
      #     binding the guarded reference to the inserted one, which these patterns cannot express,
      #     or a per-file rule — the curated-list shape this repo has already been bitten by.
      #
      # ⚠ TWO SHAPES PER GUARD, BECAUSE THIS REPOSITORY WRITES BOTH AND A SINGLE ARM WOULD FIRE
      # ON THE OTHER. `if err := X(...); err != nil { ... return ... }` is the common one; a bare
      # `return X(...)` — template/store.go:289's assertAssigneeInWorkspace — propagates the
      # error just as completely and is just as guarded. #183 named this trap explicitly
      # ("a single tightened arm would FIRE ON THE SECOND"); the clean-tree scan is what proves
      # it does not.
      #
      # ⚠ WHAT THESE ARMS STILL CANNOT SEE, stated rather than implied: a bare `return X(...)`
      # cannot be made inert by the census's mutation, so the second shape is exempted on its
      # form rather than on a measurement of it. Making THAT inert means `X(...); return nil`,
      # which changes the return statement itself — a different mutation, and one no arm here
      # would catch. Named, not fixed.
      - pattern-not-inside: |
          func $F(...) $R {
            ...
            if $E := tenancy.AssertRefInWorkspace(...); $E != nil {
              ...
              return ...
            }
            ...
          }
      - pattern-not-inside: |
          func $F(...) $R {
            ...
            return tenancy.AssertRefInWorkspace(...)
          }
      - pattern-not-inside: |
          func $F(...) $R {
            ...
            if $E := $G.assertRefInWorkspace(...); $E != nil {
              ...
              return ...
            }
            ...
          }
      - pattern-not-inside: |
          func $F(...) $R {
            ...
            return $G.assertRefInWorkspace(...)
          }
      - pattern-not-inside: |
          func $F(...) $R {
            ...
            if $E := $G.assertIssueInWorkspace(...); $E != nil {
              ...
              return ...
            }
            ...
          }
      - pattern-not-inside: |
          func $F(...) $R {
            ...
            return $G.assertIssueInWorkspace(...)
          }
      # dependency.Store.Create's proof that BOTH relation endpoints are in the caller's
      # authorized workspace. Added with source_id|target_id above: until they were in the
      # alternation this rule could not see the issue_relations write path at all, and the
      # sibling child-insert rule was releasing it on a workspace_id COLUMN that proves
      # nothing about the refs beside it. Deleting this call is now RED in both rules.
      - pattern-not-inside: |
          func $F(...) $R {
            ...
            if $E := $G.assertIssuesShareWorkspace(...); $E != nil {
              ...
              return ...
            }
            ...
          }
      - pattern-not-inside: |
          func $F(...) $R {
            ...
            return $G.assertIssuesShareWorkspace(...)
          }
