rules:
  - id: operate-by-id-write-requires-workspace-scope
    languages: [go]
    severity: ERROR
    message: >-
      SEC-5: this store performs a by-id DELETE/UPDATE (WHERE id = $n) with NO workspace_id
      predicate — the operate-by-id cross-tenant IDOR class. A caller authorized for workspace
      A can act on another workspace's object by passing its id. Add "AND workspace_id = $n",
      take the workspace from the authz-authorized context (authz.WorkspaceID — never the URL
      or body), and return a not-found sentinel on 0 rows so a foreign id 404s. Reference:
      project.Store.Delete / cycle.Store.Update (WHERE id=$1 AND workspace_id=$n).
    patterns:
      # A pgx Exec/QueryRow whose SQL LITERAL is a by-id DELETE or UPDATE ... WHERE id = $n.
      # NOTE: metavariable-regex is re.match-anchored and the value includes the leading
      # backtick/quote, so the pattern must start with (?s).* to search the whole literal.
      # Two spellings, positive and negative in lockstep — see cross-object-tenancy.yml.
      # The NOTE above is now half-obsolete and says so: metavariable-regex alone bound only
      # the literal, so a `const delSQL = "DELETE FROM ... WHERE id = $1"` was invisible to
      # this rule AND to the sprintf companion. The "=~/.../" arm reads the propagated value.
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $Q.Exec($CTX, $SQL, ...)
                  - pattern: $Q.QueryRow($CTX, $SQL, ...)
              - metavariable-regex:
                  metavariable: $SQL
                  regex: (?s).*(DELETE\s+FROM\s+\w+|UPDATE\s+\w+\s+SET).*\bWHERE\s+id\s*=\s*\$
          - pattern-either:
              - pattern: $Q.Exec($CTX, "=~/(?s).*(DELETE\s+FROM\s+\w+|UPDATE\s+\w+\s+SET).*\bWHERE\s+id\s*=\s*\$/", ...)
              - pattern: $Q.QueryRow($CTX, "=~/(?s).*(DELETE\s+FROM\s+\w+|UPDATE\s+\w+\s+SET).*\bWHERE\s+id\s*=\s*\$/", ...)
      # Excluded when the SAME statement is already workspace-scoped (…AND workspace_id = $n):
      # the by-id op provably acts within one workspace and is safe.
      #
      # ⚠ THE EXEMPTION REQUIRES AN EQUALITY (`\bworkspace_id\s*=`), NOT A MENTION, AND IT USED TO
      # REQUIRE ONLY A MENTION. `(?s).*workspace_id` matched the WORD ANYWHERE in the statement —
      # a RETURNING clause, a SET target, even a comment — so a genuinely unscoped by-id write that
      # merely NAMED the column bought the exemption. MEASURED at 3eaf713 on project.Store.Delete:
      # `DELETE FROM projects WHERE id = $1 AND $2 <> '' RETURNING workspace_id` — no workspace
      # predicate at all — scored NOT CAUGHT. It scores CAUGHT now. Removing the word entirely was
      # CAUGHT both before and after, which is the positive control proving the rule fires here.
      #
      # ⚠⚠ THIS IS THE FOURTH MEMBER OF ONE FAMILY IN THIS REPOSITORY, AND THE FIRST IN TEXT RATHER
      # THAN AST FORM. #173 owner-gate: `...` matches any body, so an inert gate satisfies the
      # pattern-not. #178 workspace-authz rule A: a metavariable receiver, so the WRONG INSTANCE of
      # a repeated shape buys the exemption. #180 child-insert: both at once. Here: a substring
      # match, so a MENTION buys it rather than a predicate. ROOT CAUSE EVERY TIME — THE EXEMPTION
      # IS KEYED ON A CONSTRUCT BEING PRESENT, NOT ON IT DOING THE JOB.
      #
      # ⚠ RESIDUAL, MEASURED NOT ASSUMED: an equality is still not a FILTER.
      # `UPDATE projects SET workspace_id = $2 WHERE id = $1` contains `workspace_id =` as an
      # ASSIGNMENT and is unscoped; it scores NOT CAUGHT and stays so. Distinguishing a SET target
      # from a WHERE predicate needs SQL parsing, which a regex over the literal cannot do. That
      # shape is held behaviourally — TestSEC5_Group1_CrossTenantDelete catches all three mutations
      # — and is stated here rather than left to be rediscovered.
      # scripts/w34-operate-by-id-exemption-controls-8x2m.py scores P1/P2/P3.
      - pattern-not:
          pattern-either:
            - patterns:
                - pattern-either:
                    - pattern: $Q.Exec($CTX, $SQL, ...)
                    - pattern: $Q.QueryRow($CTX, $SQL, ...)
                - metavariable-regex:
                    metavariable: $SQL
                    regex: (?s).*\bworkspace_id\s*=
            - pattern-either:
                - pattern: $Q.Exec($CTX, "=~/(?s).*\bworkspace_id\s*=/", ...)
                - pattern: $Q.QueryRow($CTX, "=~/(?s).*\bworkspace_id\s*=/", ...)
    paths:
      # SEC-5. Empty exclude for THIS rule — but note its scope. It USED TO match only inline string
      # literal SQL, and was BLIND to `sql := fmt.Sprintf(...); Exec(ctx, sql, ...)` — exactly how issue
      # BulkUpdate's unscoped by-id write slipped past the "machine-proof" claim. The companion rule
      # operate-by-id-write-requires-workspace-scope-sprintf (below) covers the Sprintf-constructed case,
      # and the "=~/.../" arm added above covers const/var-held SQL. ⚠ WHAT IS STILL NOT COVERED, stated
      # rather than implied: SQL assembled from a literal plus a RUNTIME operand binds neither arm —
      # constant propagation cannot fold it and the text arm sees only the identifier. So the
      # "machine-proof over the whole by-id surface" claim holds for literal, concatenated, const- and
      # Sprintf-built statements, and NOT for runtime-assembled ones. Groups 1-4 scoped every user-facing by-id DELETE/UPDATE (AND workspace_id / join).
      #
      # The remaining suppressions are INLINE `nosemgrep` lines, each with a written justification at
      # the code, for by-id writes that are genuinely NOT workspace-membership scoped (a reviewer
      # sees the reason in context, not hidden in a path glob):
      #   - workspace/store.go Delete   — self-scoping: id IS the authorized workspace (tenant root)
      #   - workspace/store.go Update   — same, via the -sprintf companion rule
      #   - guest/store.go invite-accept — token-scoped: id resolved from a secret bearer token
      #   - featureboard/store.go vote×2 — public board: assertPostOnPublicBoard-guarded, email-identified
      #
      # ⚠ THIS LIST SAID "three" AND THERE WERE FIVE, WITH workspace/store.go's -sprintf SUPPRESSION
      # MISSING FROM IT ENTIRELY. Counted at 74ca01b: FIVE on this rule family and NINE across all
      # four locks (child-insert ×3, caller-workspace-id-query ×1). A prose census of holes goes
      # stale the first moment somebody adds a hole, and nothing was checking this one. THE COUNT IS
      # NO LONGER MAINTAINED HERE: internal/tenancy/suppression_census_test.go holds a per-rule
      # CEILING and requires every suppression to carry an INVALIDATED IF clause. Adding one is now
      # an edit to that map in the same commit; removing one is free.
      exclude: []

  - id: operate-by-id-write-requires-workspace-scope-sprintf
    languages: [go]
    severity: ERROR
    message: >-
      SEC-5 (Sprintf variant): a by-id DELETE/UPDATE whose SQL is built with fmt.Sprintf has NO
      workspace_id in its FORMAT literal — the same operate-by-id cross-tenant IDOR class, but constructed
      dynamically so the inline-literal rule above is BLIND to it (the $SQL metavariable binds the variable
      name, not the format string). This is exactly how issue BulkUpdate slipped past the "empty exclude =
      machine-proof" claim. Add "AND workspace_id = $n" to the format string and thread authz.WorkspaceID.
    patterns:
      - pattern: fmt.Sprintf($FMT, ...)
      - metavariable-regex:
          metavariable: $FMT
          regex: (?s).*(DELETE\s+FROM\s+\w+|UPDATE\s+\w+\s+SET).*\bWHERE\s+id\s*=\s*\$
      - pattern-not:
          patterns:
            - pattern: fmt.Sprintf($FMT, ...)
            - metavariable-regex:
                metavariable: $FMT
                regex: (?s).*\bworkspace_id\s*=
    paths:
      # Suppressed INLINE (nosemgrep + written reason) at the by-other-means-safe Sprintf sites — NOT a
      # path glob — so a reviewer sees the justification in context:
      #   - workspace/store.go Update — self-scoping: id IS the authorized workspace (tenant root); no
      #     separate workspace_id column applies (mirrors the existing Delete nosemgrep in this file).
      exclude: []
