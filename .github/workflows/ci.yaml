name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Regression locks (semgrep, whole .semgrep/ dir) for two tenancy/authz classes:
  #   - object-graph cross-object tenancy: a store inserting a cross-object *_id reference
  #     alongside workspace_id without tenancy.AssertRefInWorkspace
  #     (.semgrep/cross-object-tenancy.yml, internal/tenancy/closure_test.go)
  #   - workspace-authz IDOR: a /v1 handler reading the workspace from chi.URLParam("wsID"),
  #     reading the spoofable X-Member-Id, or taking a flat ?workspace_id= without
  #     authz.AuthorizeWorkspace (.semgrep/workspace-authz.yml — see its header for the
  #     body/tool-arg limit that MCP/T11b rests on tests for, not this lock)
  tenancy-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Tenancy + workspace-authz IDOR regression locks
        run: |
          python -m pip install --quiet semgrep
          # cmd/ IS IN SCOPE. The scan used to cover internal/ only, which left
          # cmd/track/main.go — the file that defines gwExempt, i.e. WHICH ROUTES SKIP
          # AUTHENTICATION, and which has no test files at all — outside the lock.
          semgrep scan --config .semgrep/ --error --metrics=off internal/ cmd/

  # Formal static-analysis gate (T3): golangci-lint (errcheck, govet, ineffassign,
  # staticcheck, unused). Config in .golangci.yml. Blocking — a finding fails the build.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"
          cache: true
      # Format gate. There was none: golangci-lint v2 moved formatters OUT of `linters:`,
      # so .golangci.yml (which has no `formatters:` block) checked no formatting at all
      # and four files had drifted on main. `gofmt -l` is the single authority here —
      # deliberately not a golangci formatter, so there is exactly one definition of
      # "formatted" and no settings-shape trap. It also covers testdata/, which
      # golangci-lint does not.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi
          echo "gofmt: clean"

      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          "$(go env GOPATH)/bin/golangci-lint" run ./...

  test:
    runs-on: ubuntu-latest
    services:
      # pgvector image because migration 0007 needs the `vector` extension
      # (plain postgres lacks it); uuid-ossp + pg_trgm ship with it too.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: track
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Admin DSN for the real-Postgres migrate tests; each creates + drops its
      # own isolated database (extensions are database-scoped, so per-DB not
      # per-schema). Other packages use pgxmock and ignore this.
      TRACK_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"
          cache: true
      - name: go vet
        run: go vet ./...
      # Prove the runner applies the real schema cleanly against real Postgres.
      - name: track migrate up (real Postgres)
        run: go run ./cmd/track migrate up
        env:
          TRACK_DATABASE_URL: postgres://postgres:postgres@localhost:5432/track?sslmode=disable
      - name: track migrate status
        run: go run ./cmd/track migrate status
        env:
          TRACK_DATABASE_URL: postgres://postgres:postgres@localhost:5432/track?sslmode=disable
      # The real-Postgres tests now FAIL rather than skip when TRACK_TEST_DATABASE_URL is
      # absent (internal/testutil.RequireDatabaseURL), so a database that never came up
      # can no longer produce a green run with the whole tenancy/IDOR suite silently
      # skipped. `-short` is the single deliberate escape — assert CI never uses it, so
      # nobody can turn a red gate green by adding a flag.
      - name: guard — the suite must not run in -short mode
        run: |
          # Anchored to a line that STARTS with the invocation (optionally after `run:`)
          # so this check cannot match its own grep pattern or any prose above it.
          if grep -RnE '^[[:space:]]*(run:[[:space:]]*)?go test .*-short' .github/workflows/; then
            echo "::error::CI runs go test with -short, which skips every real-Postgres test"
            exit 1
          fi
          echo "no -short in CI"

      - name: go test
        run: go test -timeout 120s -race -count=1 ./...

      # Positive control on the gate itself: with the DSN removed the suite MUST fail.
      # A gate nobody has watched fail is a gate nobody knows still works — this is the
      # cheapest way to keep "missing database ⇒ red" true rather than assumed.
      - name: guard — a missing database must FAIL, not skip
        env:
          TRACK_TEST_DATABASE_URL: ""
        run: |
          if go test -count=1 ./internal/authz/ >/dev/null 2>&1; then
            echo "::error::the tenancy suite PASSED with no database — it is skipping, not running"
            exit 1
          fi
          echo "confirmed: no database => red"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: cd frontend && npm ci
      - name: Typecheck
        run: cd frontend && npm run typecheck
      - name: Build
        run: cd frontend && npm run build

  build-image:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/talyvor-track:latest
            ghcr.io/${{ github.repository_owner }}/talyvor-track:${{ github.sha }}
