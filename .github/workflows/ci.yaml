name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Regression locks (semgrep, whole .semgrep/ dir) for two tenancy/authz classes:
  #   - object-graph cross-object tenancy: a store inserting a cross-object *_id reference
  #     alongside workspace_id without tenancy.AssertRefInWorkspace
  #     (.semgrep/cross-object-tenancy.yml, internal/tenancy/closure_test.go)
  #   - workspace-authz IDOR: a /v1 handler reading the workspace from chi.URLParam("wsID"),
  #     reading the spoofable X-Member-Id, or taking a flat ?workspace_id= without
  #     authz.AuthorizeWorkspace (.semgrep/workspace-authz.yml — see its header for the
  #     body/tool-arg limit that MCP/T11b rests on tests for, not this lock)
  tenancy-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Tenancy + workspace-authz IDOR regression locks
        run: |
          python -m pip install --quiet semgrep
          # cmd/ IS IN SCOPE. The scan used to cover internal/ only, which left
          # cmd/track/main.go — the file that defines gwExempt, i.e. WHICH ROUTES SKIP
          # AUTHENTICATION, and which has no test files at all — outside the lock.
          semgrep scan --config .semgrep/ --error --metrics=off internal/ cmd/

  # ORG-LEVEL CLASS GUARD, not a Track guard. talyvor-docs and talyvor-track independently
  # shipped the identical defect — a compose file supplying a real default for
  # GATEWAY_AUTH_SECRET — and two separate audits found them. A per-repo test cannot catch
  # the next repo, so scripts/check-compose-secrets.sh is COPIED VERBATIM from talyvor-docs
  # (byte-identical; sha256 e4e82ee8…) and contains no repo-specific knowledge: no service
  # names, no paths, and no memory of any particular string. It matched Track's
  # POSTGRES_PASSWORD defaults by SHAPE, three of which nobody had reported.
  #
  # Deliberately its own job, with no `needs:`, so it runs in parallel and reports
  # independently of the Go suite — the finding it makes is a deploy blocker, not a test
  # failure, and should not be buried behind a 2-minute test job.
  compose-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: no compose file may supply a secret value
        run: ./scripts/check-compose-secrets.sh

  # Formal static-analysis gate (T3): golangci-lint (errcheck, govet, ineffassign,
  # staticcheck, unused). Config in .golangci.yml. Blocking — a finding fails the build.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # ⚠ MUST EQUAL go.mod's `toolchain` (go1.26.6), and W6.34 learned this from CI rather
          # than from a doc: golangci-lint REFUSES to run when it was built with a Go older than
          # the module's targeted version — "the Go language version (go1.25) used to build
          # golangci-lint is lower than the targeted Go version (1.26.6)". actions/setup-go also
          # exports GOTOOLCHAIN=local, so go.mod's toolchain directive is NOT auto-fetched here:
          # this pin is what the job actually runs, and the tests therefore exercise the runtime
          # the release is built with. internal/migrate/toolchain_pin_test.go enforces the lockstep.
          go-version: "1.26.6"
          cache: true
      # Format gate. There was none: golangci-lint v2 moved formatters OUT of `linters:`,
      # so .golangci.yml (which has no `formatters:` block) checked no formatting at all
      # and four files had drifted on main. `gofmt -l` is the single authority here —
      # deliberately not a golangci formatter, so there is exactly one definition of
      # "formatted" and no settings-shape trap. It also covers testdata/, which
      # golangci-lint does not.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi
          echo "gofmt: clean"

      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          "$(go env GOPATH)/bin/golangci-lint" run ./...

  # Supply-chain gate: govulncheck against the Go vulnerability DB.
  #
  # ⚠ THERE WAS NONE, AND THE ABSENCE WAS THE FINDING (W6.33). Measured on clean main
  # `928bd981`: `govulncheck ./...` reported ELEVEN CALLED vulnerabilities — CALLED, not the
  # separate "in modules you require but your code doesn't appear to call" bucket it counts on
  # its own line — and `grep -c govulncheck .github/workflows/ci.yaml` was 0. talyvor-lens has
  # gated on this every build all along; track holds the issue tracker's Postgres and was not
  # watched at all. The asymmetry was as much the finding as the eleven were.
  #
  # ⚠ THIS JOB WAS LANDED RED ON PURPOSE, BEFORE the dependency bumps that clear it, and the
  # PR's own check history is the evidence: the first commit is this job alone and it FAILS
  # naming GO-2026-5970 (golang.org/x/text) and GO-2026-5004 (github.com/jackc/pgx — SQL
  # injection via placeholder confusion, reached from migrate.StatusOf). A gate nobody has
  # watched fail is the same thing as no gate, which is the state this repo was already in.
  #
  # govulncheck is reachability-aware, so it stays low-noise: a require-only/unreachable vuln
  # does not fail the build. The tool is pinned; the advisory DB is fetched fresh at scan time,
  # so this job can go red on a tree nobody touched — that is the point of it.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # ⚠ MUST EQUAL go.mod's `toolchain` (go1.26.6). govulncheck grades the STDLIB against
          # the toolchain it runs under, so a pin ABOVE go.mod's would assess a runtime this
          # repo does not ship and could report green over a vulnerable binary; a pin BELOW it
          # reports vulns nothing ships. internal/migrate/toolchain_pin_test.go enforces the
          # floor half of that lockstep across every go-version pin in this file.
          go-version: "1.26.6"
          cache: false
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  test:
    runs-on: ubuntu-latest
    services:
      # pgvector image because migration 0007 needs the `vector` extension
      # (plain postgres lacks it); uuid-ossp + pg_trgm ship with it too.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: track
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Admin DSN for the real-Postgres migrate tests; each creates + drops its
      # own isolated database (extensions are database-scoped, so per-DB not
      # per-schema). Other packages use pgxmock and ignore this.
      TRACK_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # ⚠ MUST EQUAL go.mod's `toolchain` (go1.26.6), and W6.34 learned this from CI rather
          # than from a doc: golangci-lint REFUSES to run when it was built with a Go older than
          # the module's targeted version — "the Go language version (go1.25) used to build
          # golangci-lint is lower than the targeted Go version (1.26.6)". actions/setup-go also
          # exports GOTOOLCHAIN=local, so go.mod's toolchain directive is NOT auto-fetched here:
          # this pin is what the job actually runs, and the tests therefore exercise the runtime
          # the release is built with. internal/migrate/toolchain_pin_test.go enforces the lockstep.
          go-version: "1.26.6"
          cache: true
      - name: go vet
        run: go vet ./...
      # Prove the runner applies the real schema cleanly against real Postgres.
      - name: track migrate up (real Postgres)
        run: go run ./cmd/track migrate up
        env:
          TRACK_DATABASE_URL: postgres://postgres:postgres@localhost:5432/track?sslmode=disable
      - name: track migrate status
        run: go run ./cmd/track migrate status
        env:
          TRACK_DATABASE_URL: postgres://postgres:postgres@localhost:5432/track?sslmode=disable
      # The real-Postgres tests now FAIL rather than skip when TRACK_TEST_DATABASE_URL is
      # absent (internal/testutil.RequireDatabaseURL), so a database that never came up
      # can no longer produce a green run with the whole tenancy/IDOR suite silently
      # skipped. `-short` is the single deliberate escape — assert CI never uses it, so
      # nobody can turn a red gate green by adding a flag.
      # A `finally` DOES NOT RUN ON SIGTERM, and 61 of this repo's control scripts mutate a
      # tracked file and restore it in one — the LARGEST such population in the estate, more than
      # a third of it. NONE installed a handler before this step.
      #
      # ⚠ ORG-LEVEL CLASS GUARD, NOT A TRACK GUARD — the same reasoning the compose-secrets job
      # already states here. The hazard was measured in talyvor-suite (W1.7, 78c69c8): a 2-minute
      # command timeout killed a control mid-mutation and left deploy/decision-expiry.sh reading
      # `if true; then` WHERE A GATE HAD BEEN, with a green suite and a `git status` showing only
      # files the session had edited on purpose. Reproduced on demand in suite 5de27e3, in
      # talyvor-docs ffe9063, and AGAIN HERE while porting: same kill, and the file left mutated
      # was go.mod.
      #
      # Estate-wide at 64f379d: 163 mutate-and-restore scripts, 3 protected — all three in the one
      # repo that had been bitten. The script carries no Track-specific knowledge.
      #
      # The allowlist inside it may only SHRINK: R2 fails on an entry that has been fixed, R1 on a
      # new unprotected script, R3 is a floor on the DETECTOR. Detection is `ast`, never grep — a
      # regex counts the word "signal" in a COMMENT as a handler, and `grep -l finally:` counts 90
      # scripts here where the real population is 61.
      - name: control scripts must restore on SIGTERM, not only in a finally
        run: python3 scripts/check-restore-signal-handlers.py --ci
      # A control anchored on how many times a literal appears goes inert the day another
      # job duplicates it — and the only thing that reports it is the control's own run,
      # which is by hand. V7 of the toolchain campaign expected TWO `go-version` pins in
      # this file and there are THREE; the campaign printed `7/8 controls CAUGHT` and
      # nothing noticed, because an inert control looks exactly like a passing one.
      # talyvor-docs had the identical defect and the same repair (#225).
      # The full campaign mutates tracked files and runs the guard suite once per control,
      # so it cannot go here. The ANCHOR check is pure counting over three files — no
      # mutation, no `go test`, ~0.1s — and it is the half that rots. (It proves each
      # control can still be APPLIED, not that it still CATCHES; the campaign proves that.)
      - name: toolchain control anchors must still apply
        run: python3 scripts/w634-toolchain-pin-controls.py --check-anchors --ci

      - name: guard — the suite must not run in -short mode
        run: |
          # Anchored to a line that STARTS with the invocation (optionally after `run:`)
          # so this check cannot match its own grep pattern or any prose above it.
          if grep -RnE '^[[:space:]]*(run:[[:space:]]*)?go test .*-short' .github/workflows/; then
            echo "::error::CI runs go test with -short, which skips every real-Postgres test"
            exit 1
          fi
          echo "no -short in CI"

      - name: go test
        run: go test -timeout 120s -race -count=1 ./...

      # Positive control on the gate itself: with the DSN removed the suite MUST fail.
      # A gate nobody has watched fail is a gate nobody knows still works — this is the
      # cheapest way to keep "missing database ⇒ red" true rather than assumed.
      - name: guard — a missing database must FAIL, not skip
        env:
          TRACK_TEST_DATABASE_URL: ""
        run: |
          if go test -count=1 ./internal/authz/ >/dev/null 2>&1; then
            echo "::error::the tenancy suite PASSED with no database — it is skipping, not running"
            exit 1
          fi
          echo "confirmed: no database => red"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: cd frontend && npm ci
      - name: Typecheck
        run: cd frontend && npm run typecheck
      # The SPA's request surface — verb, path, query keys, body fields — regenerated from the
      # TypeScript type checker and diffed against the committed JSON.
      #
      # ⚠ THIS STEP IS WHAT MAKES cmd/track/spa_request_body_contract_test.go HONEST, AND THE TWO
      # HALVES DELIBERATELY LIVE IN DIFFERENT JOBS. The Go job has no node, so it reads the
      # committed file; a committed file nothing regenerates is a snapshot of a tree that no longer
      # exists, and the census over it would keep reporting a clean request contract while the SPA
      # drifted underneath it. That is the exact failure this whole item is about — a green census
      # over a dead endpoint. If this step ever has to be removed, the Go census must go with it.
      - name: SPA request surface must match the committed census input
        run: |
          cd frontend
          node scripts/spa-request-surface.mjs > testdata/spa-request-surface.json
          if ! git diff --exit-code -- testdata/spa-request-surface.json; then
            echo "::error::frontend/testdata/spa-request-surface.json is stale — regenerate it with"
            echo "::error::  cd frontend && node scripts/spa-request-surface.mjs > testdata/spa-request-surface.json"
            echo "::error::and commit the result. cmd/track's request-body and query censuses read this file."
            exit 1
          fi
      - name: Build
        run: cd frontend && npm run build

  build-image:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # ⚠ THE STAMP. Dockerfile builds with `-ldflags "-X main.version=${VERSION}"`, and
          # without this the ARG defaulted to `dev` — but it made no difference either way,
          # because `main.version` did not exist and the Go linker silently ignores -X for a
          # symbol it cannot find. Measured (W3.47): every image answered /livez with
          # {"version":"0.1.0"}, so :latest and :<sha> were indistinguishable at runtime.
          # The SHA is what the tags below already use, so the stamp and the tag agree by
          # construction. cmd/track/version_stamp_test.go keeps the ldflags path working.
          build-args: |
            VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/talyvor-track:latest
            ghcr.io/${{ github.repository_owner }}/talyvor-track:${{ github.sha }}
