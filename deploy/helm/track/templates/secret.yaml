{{- if .Values.secret.create -}}
# DEV/TEST ONLY. In production set secret.existingSecret and create the Secret
# out of band (External Secrets Operator, Sealed Secrets, kubectl).
{{- $_ := required "secret.data.TRACK_DATABASE_URL is required when secret.create=true" .Values.secret.data.TRACK_DATABASE_URL }}
{{- $_ := required "secret.data.GATEWAY_AUTH_SECRET is required when secret.create=true (openssl rand -hex 32)" .Values.secret.data.GATEWAY_AUTH_SECRET }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "track.secretName" . }}
  labels:
    {{- include "track.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secret.data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
