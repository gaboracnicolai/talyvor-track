services:
  track:
    build: .
    ports:
      - "3000:3000"
    environment:
      # POSTGRES_PASSWORD has NO default. It shipped as `${POSTGRES_PASSWORD:-changeme}` in
      # three places here, which is the same shape as the gateway-secret defect one line
      # below: a `:-` fallback SUPPLIES the value, so `docker compose up` with no operator
      # input started Postgres with a password published in this repo. Caught by
      # scripts/check-compose-secrets.sh, which finds it by SHAPE — it has no knowledge of
      # this repo or of the string `changeme`.
      - TRACK_DATABASE_URL=postgres://track:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (openssl rand -hex 16) — there is no default; `changeme` shipped here for the life of this file}@postgres:5432/talyvor_track?sslmode=disable
      - TRACK_REDIS_URL=redis://redis:6379
      # Realtime HA fan-out across instances (T13). OFF by default — this single
      # bundled instance needs no cross-instance sharing. Set true when scaling
      # Track to 2+ replicas so live events reach clients on every instance.
      - TRACK_HA_ENABLED=${TRACK_HA_ENABLED:-false}
      - TRACK_LENS_URL=${TRACK_LENS_URL:-http://localhost:8080}
      - TRACK_LENS_API_KEY=${TRACK_LENS_API_KEY:-}
      # Lens's LENS_MINT_KEY — required for AI features. NEVER Lens's LENS_API_KEY.
      - TRACK_LENS_MINT_KEY=${TRACK_LENS_MINT_KEY:-}
      - TRACK_LENS_WEBHOOK_SECRET=${TRACK_LENS_WEBHOOK_SECRET:-}
      - TRACK_LENS_DASHBOARD_URL=${TRACK_LENS_DASHBOARD_URL:-}
      - TRACK_GITHUB_WEBHOOK_SECRET=${TRACK_GITHUB_WEBHOOK_SECRET:-}
      # ⚠ THE THREE BELOW WERE READ BY THE PROCESS AND DECLARED NOWHERE. Same mechanism as the
      # secrets above: this service has an explicit `environment:` list and no `env_file:`, so a
      # variable set in .env that is not named here reaches NOTHING. The container starts, passes
      # its healthcheck, and the capability is simply inert — there is no error to read.
      # cmd/track/compose_env_reach_test.go now enumerates credential-shaped names FROM THE SOURCE
      # and fails when one is not forwarded, so this cannot recur by omission.
      #
      # Gates LIVE Jira/Linear API import in its entirety (AES-256-GCM at rest for each
      # workspace's provider token). Unset ⇒ integrations.Store is never constructed, so
      # WithIntegrationChecker is never called (linear_api/jira_api enqueue is refused) and
      # WithProviderConfig is never called (those jobs fail "integrations not configured").
      # The ONLY signal is one slog.Info at boot. Must decode to exactly 32 bytes:
      # `openssl rand -base64 32`. Empty ⇒ live API import stays off, CSV import unaffected.
      - TRACK_INTEGRATION_ENCRYPTION_KEY=${TRACK_INTEGRATION_ENCRYPTION_KEY:-}
      # Signs guest-access tokens. Unset ⇒ internal/guest/store.go mints a RANDOM per-process
      # secret, so every guest token dies on restart and no two replicas accept each other's.
      # The code's own comment says the operator must set it — and until this line existed there
      # was no way to. Empty is still a working dev default, deliberately.
      - TRACK_GUEST_SECRET=${TRACK_GUEST_SECRET:-}
      # Bearer secret for the two gwExempt service endpoints Docs pulls: GET /v1/service/members
      # and GET /v1/service/workspaces. Unset ⇒ Track boots and both 401 EVERYTHING, which reads
      # to Docs as "Track has no members". Optional, but >= MinMemberSyncSecretLen when set —
      # boot-fail-closed, since it gates every tenant's roster.
      - TRACK_MEMBER_SYNC_SECRET=${TRACK_MEMBER_SYNC_SECRET:-}
      # Track's copy of the edge gateway transit-proof secret — the root of the entire
      # auth boundary: whoever knows it can present ANY identity to Track.
      #
      # NO DEFAULT, BY DESIGN. This used to fall back to a literal committed here, which
      # satisfied Track's >=16-char boot check while being public — so the stack booted
      # "fail-closed" with a secret anyone could read out of the repo. `:?` makes compose
      # REFUSE to render the stack when the variable is unset or empty; there is nothing
      # to fall back to. Generate one per environment: openssl rand -hex 32
      - GATEWAY_AUTH_SECRET=${GATEWAY_AUTH_SECRET:?set GATEWAY_AUTH_SECRET to the edge gateway transit-proof secret (openssl rand -hex 32) — there is no default; a shared default is a published credential}
      - TRACK_LOG_LEVEL=${TRACK_LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - track
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: talyvor_track
      POSTGRES_USER: track
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (openssl rand -hex 16) — there is no default; `changeme` shipped here for the life of this file}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U track -d talyvor_track"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot schema migrator: applies all migrations via the canonical
  # `track migrate up` runner (embedded migrations) before the app starts — the SAME
  # path production uses. Replaces the old init-time schema mount so dev and prod share
  # one schema authority. Exits 0 when up to date; `track` waits on its completion.
  migrate:
    build: .
    command: ["migrate", "up"]
    environment:
      # No default — same reason as the track service above.
      - TRACK_DATABASE_URL=postgres://track:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (openssl rand -hex 16) — there is no default; `changeme` shipped here for the life of this file}@postgres:5432/talyvor_track?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
